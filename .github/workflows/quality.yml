name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deeppresenter/html2pptx/package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils
      - name: Install Python and Node dependencies
        run: |
          uv sync --frozen
          npm ci --prefix deeppresenter/html2pptx
          uv run playwright install --with-deps chromium
      - name: Run offline test suite
        run: uv run pytest -q -m "not llm and not parse"
      - name: Build distributions
        run: uv build
      - name: Verify wheel entrypoints
        run: |
          uv venv --python 3.11 .package-test
          uv pip install --python .package-test/bin/python dist/*.whl
          .package-test/bin/pptagent --help
          .package-test/bin/deeppresenter --help
          .package-test/bin/python -c "import deeppresenter, pptagent.mcp_server"
