name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run credential-free unit and client-contract tests
        run: uv run pytest -q -m "unit and not llm and not parse and not benchmark"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Chromium test runtime
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Run browser tests
        run: uv run pytest -q -m browser

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deeppresenter/html2pptx/package-lock.json
      - name: Install export runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils
          uv sync --frozen
          npm ci --prefix deeppresenter/html2pptx
          uv run playwright install --with-deps chromium
      - name: Run export tests
        run: uv run pytest -q -m export

  package:
    needs: [unit, browser, export]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Verify wheel entrypoints
        run: |
          uv venv --python 3.11 .package-test
          uv pip install --python .package-test/bin/python dist/*.whl
          .package-test/bin/slidex --help
          .package-test/bin/pptagent --help
          .package-test/bin/python -c "import deeppresenter, pptagent.mcp_server"
